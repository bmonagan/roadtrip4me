name: CI & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  FLY_ACCESS_TOKEN: ${{ secrets.FLY_ACCESS_TOKEN }}

jobs:
  # ─── CI checks (run at repo root) ────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate --config apps/api/prisma.config.js

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  # ─── Deploy API ───────────────────────────────────────────────────
  deploy-api:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/fly-actions/gactions/deploy@master
        with:
          app: roadtrip4me-api
          working_directory: apps/api

      - name: Set Fly secrets (API)
        run: |
          fly secrets set --app roadtrip4me-api \
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }} \
            STRIPE_PRICE_ID=${{ secrets.STRIPE_PRICE_ID }} \
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }} \
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }} \
            APP_ORIGIN=https://roadtrip4me-web.fly.dev \
            CORS_ORIGIN=https://roadtrip4me-web.fly.dev

  # ─── Deploy Web ───────────────────────────────────────────────────
  deploy-web:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/fly-actions/gactions/deploy@master
        with:
          app: roadtrip4me-web
          working_directory: apps/web

      - name: Set Fly secrets (Web)
        run: |
          fly secrets set --app roadtrip4me-web \
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }} \
            VITE_API_URL=https://roadtrip4me-api.fly.dev \
            VITE_AUTH0_DOMAIN=${{ secrets.VITE_AUTH0_DOMAIN }} \
            VITE_AUTH0_CLIENT_ID=${{ secrets.VITE_AUTH0_CLIENT_ID }} \
            VITE_AUTH0_AUDIENCE=${{ secrets.VITE_AUTH0_AUDIENCE }}
