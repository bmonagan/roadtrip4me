# RoadTrip4Me API — Fly.io configuration
# Deploy: fly deploy --image ghcr.io/<repo>/roadtrip4me-api:<sha>

app = "roadtrip4me-api"
primary_region = "ord"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "pause"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
