# RoadTrip4Me API — Fly.io configuration

app = "roadtrip4me-api"
primary_region = "ord"

[build]
  remote_only = false
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 0 lets the machine stop when idle and wake on traffic — the app only costs
  # compute while someone is actually using it. The DB stays running (always-on
  # source of truth); use `fly apps suspend` to stop everything manually.
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
