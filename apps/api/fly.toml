# RoadTrip4Me API — Fly.io configuration

app = "roadtrip4me-api"
primary_region = "ord"

[build]
  remote_only = false
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
