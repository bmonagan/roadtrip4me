# RoadTrip4Me Web — Fly.io configuration
# Deploy: fly deploy --image ghcr.io/<repo>/roadtrip4me-web:<sha>

app = "roadtrip4me-web"
primary_region = "ord"

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "pause"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
