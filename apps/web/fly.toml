# RoadTrip4Me Web — Fly.io configuration

app = "roadtrip4me-web"
primary_region = "ord"

[build]
  remote_only = true
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
