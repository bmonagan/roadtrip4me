# RoadTrip4Me Web — Fly.io configuration

app = "roadtrip4me-web"
primary_region = "ord"

[build]
  remote_only = false
  dockerfile = "Dockerfile"

[build.args]
  VITE_MAPBOX_TOKEN = ""
  VITE_AUTH0_DOMAIN = ""
  VITE_AUTH0_CLIENT_ID = ""
  VITE_AUTH0_AUDIENCE = ""
  VITE_API_URL = ""

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
