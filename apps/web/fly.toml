# RoadTrip4Me Web — Fly.io configuration

app = "roadtrip4me-web"
primary_region = "ord"

[build]
  remote_only = false
  dockerfile = "Dockerfile"

[build.args]
  # VITE_* values are baked into the bundle at build time. Supply your own at
  # deploy time (e.g. --build-arg VITE_MAPBOX_TOKEN=...) — do not commit keys.
  VITE_MAPBOX_TOKEN = ""
  VITE_AUTH0_DOMAIN = ""
  VITE_AUTH0_CLIENT_ID = ""
  VITE_AUTH0_AUDIENCE = ""
  VITE_API_URL = "https://api.roadtrip4me.com"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 0 lets the machine stop when idle and wake on traffic — the app only costs
  # compute while someone is actually using it. The DB stays running (always-on
  # source of truth); use `fly apps suspend` to stop everything manually.
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
